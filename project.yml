name: DevicePulse
options:
  bundleIdPrefix: com.faziii.devicepulse
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

targets:
  DevicePulse:
    type: application
    platform: iOS
    sources:
      - path: DevicePulseApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faziii.devicepulse
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Device Pulse
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to estimate how much storage your Photos library is using. Nothing is uploaded or shared."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  DevicePulseMac:
    type: application
    platform: macOS
    sources:
      - path: DevicePulseMac
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Device Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.faziii.devicepulse.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Device Pulse
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
